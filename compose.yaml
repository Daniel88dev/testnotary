# Postgres for local development: `pnpm db:up`, then `pnpm db:migrate`.
# App role:       postgres://testnotary_app:testnotary_app@127.0.0.1:54329/testnotary
# Migration role: postgres://testnotary_migration:testnotary_migration@127.0.0.1:54329/testnotary
# Tests never use this file; the test world runs its own container (packages/test-world/compose.yaml).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${TESTNOTARY_PG_PORT:-54329}:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d testnotary"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 30s
      start_interval: 200ms

volumes:
  postgres-data:
